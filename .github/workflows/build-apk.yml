name: Build ARQMS Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Installable Android APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK for Release
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/debug/app-debug.apk release_apk/ARQMS-Ausgram1-Mobile-v1.0.0.apk

      - name: Upload Ready APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ARQMS-Ausgram1-Android-APK
          path: release_apk/ARQMS-Ausgram1-Mobile-v1.0.0.apk
          retention-days: 90
